<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d5e4b"/>
      <stop offset="100%" stop-color="#0b2f2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d77c"/>
      <stop offset="100%" stop-color="#b88412"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#081916" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="800" cy="220" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="180" cy="860" r="190" fill="#ffffff" opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="220" y="212" width="344" height="500" rx="34" fill="#f7f2df" transform="rotate(-12 392 462)"/>
    <rect x="240" y="232" width="304" height="460" rx="24" fill="#ffffff" transform="rotate(-12 392 462)"/>

    <rect x="456" y="286" width="344" height="500" rx="34" fill="url(#gold)" transform="rotate(10 628 536)"/>
    <rect x="476" y="306" width="304" height="460" rx="24" fill="#fffaf0" transform="rotate(10 628 536)"/>
  </g>

  <g font-family="Georgia, serif" font-weight="700" text-anchor="middle">
    <text x="360" y="426" font-size="150" fill="#111111" transform="rotate(-12 360 426)">♠</text>
    <text x="360" y="610" font-size="170" fill="#111111" transform="rotate(-12 360 610)">A</text>

    <text x="642" y="500" font-size="150" fill="#b11b1b" transform="rotate(10 642 500)">♥</text>
    <text x="642" y="680" font-size="170" fill="#b11b1b" transform="rotate(10 642 680)">K</text>
  </g>

  <rect x="110" y="110" width="804" height="804" rx="176" fill="none" stroke="#f2dfb0" stroke-opacity="0.22" stroke-width="10"/>
</svg>
